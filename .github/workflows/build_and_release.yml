name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Extract Version
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | awk -F'"' '{print $2}')
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid or missing versionName '$VERSION_NAME' in app/build.gradle.kts. Expected format X.Y.Z."
            exit 1
          fi

          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid or missing versionCode '$VERSION_CODE' in app/build.gradle.kts."
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Check Existing Release
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          GH_OUTPUT=$(gh release view "v${VERSION_NAME}" 2>&1)
          GH_EXIT=$?
          set -e

          if [ $GH_EXIT -eq 0 ]; then
            echo "ALREADY_RELEASED=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v${VERSION_NAME} already exists; skipping build. Bump versionName/versionCode to publish a new release."
            echo "Release v${VERSION_NAME} already exists; skipping build and release." >> "$GITHUB_STEP_SUMMARY"
          elif echo "$GH_OUTPUT" | grep -qiE "release not found|not found"; then
            echo "ALREADY_RELEASED=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to check existing GitHub release v${VERSION_NAME}: $GH_OUTPUT"
            exit 1
          fi

      - name: Run Unit Tests
        id: unit_tests
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Upload Test Reports on Failure
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Decode Keystore
        if: success() && steps.check_release.outputs.ALREADY_RELEASED != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release-keystore.jks"

      - name: Build Release APK
        if: success() && steps.check_release.outputs.ALREADY_RELEASED != 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify and Hash Release APK
        id: hash_apk
        if: success() && steps.check_release.outputs.ALREADY_RELEASED != 'true'
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found at $APK_PATH"
            exit 1
          fi

          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under \$ANDROID_HOME/build-tools/*/apksigner"
            exit 1
          fi

          if ! VERIFY_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH"); then
            echo "::error::APK signature verification failed for $APK_PATH"
            exit 1
          fi
          echo "$VERIFY_OUTPUT"

          SIGNER_SHA256=$(echo "$VERIFY_OUTPUT" | sed -n 's/.*SHA-256 digest:[[:space:]]*//Ip' | head -1 | tr -d '[:space:]')
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print tolower($1)}')
          if [[ ! "$APK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Computed SHA-256 '$APK_SHA256' is not a valid 64-character lowercase hex digest."
            exit 1
          fi

          printf '%s\n' "$APK_SHA256" > "${APK_PATH}.sha256"
          echo "sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"

          {
            echo "### Release v${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo ""
            echo "**Signing Certificate SHA-256 Digest:** \`${SIGNER_SHA256}\`"
            echo ""
            echo "#### Firestore \`settings/app_update\`"
            echo '```text'
            echo "latestVersionName = ${VERSION_NAME}"
            echo "latestVersionCode = ${VERSION_CODE}"
            echo "apkUrl = https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/app-release.apk"
            echo "sha256 = ${APK_SHA256}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Release
        id: create_release
        if: success() && steps.check_release.outputs.ALREADY_RELEASED != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Release v${{ env.VERSION_NAME }}
          body: |
            Release v${{ env.VERSION_NAME }} (versionCode ${{ env.VERSION_CODE }})

            SHA-256: `${{ steps.hash_apk.outputs.sha256 }}`
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          overwrite_files: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up Keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release-keystore.jks"
