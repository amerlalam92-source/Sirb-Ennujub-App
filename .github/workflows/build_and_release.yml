name: Build and Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify APK without creating a GitHub Release'
        required: false
        type: boolean
        default: false

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Extract Version
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | awk -F'"' '{print $2}')
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid or missing versionName '$VERSION_NAME' in app/build.gradle.kts. Expected format X.Y.Z."
            exit 1
          fi

          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid or missing versionCode '$VERSION_CODE' in app/build.gradle.kts."
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Check Existing Release
        id: check_release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          GH_OUTPUT=$(gh release view "v${VERSION_NAME}" 2>&1)
          GH_EXIT=$?
          set -e

          if [ $GH_EXIT -eq 0 ]; then
            echo "ALREADY_RELEASED=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v${VERSION_NAME} already exists; skipping build. Bump versionName/versionCode to publish a new release."
            echo "Release v${VERSION_NAME} already exists; skipping build and release." >> "$GITHUB_STEP_SUMMARY"
          elif echo "$GH_OUTPUT" | grep -qiE "release not found|not found"; then
            echo "ALREADY_RELEASED=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Failed to check existing GitHub release v${VERSION_NAME}: $GH_OUTPUT"
            exit 1
          fi

      - name: Run Unit Tests
        id: unit_tests
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Upload Test Reports on Failure
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Decode Keystore
        id: decode_keystore
        if: success() && steps.check_release.outputs.ALREADY_RELEASED != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release-keystore.jks"

      - name: Build Release APK
        if: success() && steps.check_release.outputs.ALREADY_RELEASED != 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Delete Keystore After Build
        if: always() && steps.decode_keystore.outcome == 'success'
        run: rm -f "${{ github.workspace }}/release-keystore.jks"

      - name: Verify and Hash Release APK
        id: hash_apk
        if: success() && steps.check_release.outputs.ALREADY_RELEASED != 'true'
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found at $APK_PATH"
            exit 1
          fi

          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found under \$ANDROID_HOME/build-tools/*/apksigner"
            exit 1
          fi

          if ! VERIFY_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH"); then
            echo "::error::APK signature verification failed for $APK_PATH"
            exit 1
          fi
          echo "$VERIFY_OUTPUT"

          ACTUAL_SIGNER_SHA256=$(printf '%s' "$VERIFY_OUTPUT" | sed -n 's/.*SHA-256 digest:[[:space:]]*//Ip' | head -1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if [[ ! "$ACTUAL_SIGNER_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to extract a valid 64-character signing certificate SHA-256 digest."
            exit 1
          fi

          EXPECTED_SIGNER_SHA256=$(printf '%s' "${{ vars.EXPECTED_SIGNER_SHA256 }}" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print tolower($1)}')
          if [[ ! "$APK_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Computed SHA-256 '$APK_SHA256' is not a valid 64-character lowercase hex digest."
            exit 1
          fi

          IS_DRY_RUN="${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}"
          {
            echo "### Release v${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo ""
            if [ "$IS_DRY_RUN" = "true" ]; then
              echo "**DRY RUN - nothing published**"
              echo ""
            fi
            echo "**Expected Signing Certificate SHA-256 Digest:** \`${EXPECTED_SIGNER_SHA256:-not set}\`"
            echo "**Actual Signing Certificate SHA-256 Digest:** \`${ACTUAL_SIGNER_SHA256}\`"
            echo ""
            echo "#### Firestore \`settings/app_update\`"
            echo '```text'
            echo "latestVersionName = ${VERSION_NAME}"
            echo "latestVersionCode = ${VERSION_CODE}"
            echo "apkUrl = https://github.com/${{ github.repository }}/releases/download/v${VERSION_NAME}/app-release.apk"
            echo "sha256 = ${APK_SHA256}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::warning::Repository variable EXPECTED_SIGNER_SHA256 is empty; skipping signer fingerprint match check."
          elif [ "$ACTUAL_SIGNER_SHA256" != "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::error::Signing certificate SHA-256 mismatch! Expected '${EXPECTED_SIGNER_SHA256}', got '${ACTUAL_SIGNER_SHA256}'."
            exit 1
          fi

          printf '%s\n' "$APK_SHA256" > "${APK_PATH}.sha256"
          echo "sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"

          printf '%s\n' \
            "Release v${VERSION_NAME} (versionCode ${VERSION_CODE})" \
            "" \
            "- **Version Name:** \`${VERSION_NAME}\`" \
            "- **Version Code:** \`${VERSION_CODE}\`" \
            "- **APK SHA-256:** \`${APK_SHA256}\`" \
            "- **Signing Certificate SHA-256:** \`${ACTUAL_SIGNER_SHA256}\`" \
            > release_notes.md

      - name: Upload Dry-Run Artifacts
        if: success() && github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 1
          if-no-files-found: error

      - name: Create Release
        id: create_release
        if: success() && steps.check_release.outputs.ALREADY_RELEASED != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          gh release create "v${VERSION_NAME}" "$APK_PATH" "${APK_PATH}.sha256" --title "Release v${VERSION_NAME}" --notes-file release_notes.md --target "$GITHUB_SHA"

          ASSETS=$(gh release view "v${VERSION_NAME}" --json assets --jq '.assets[].name')
          if ! printf '%s\n' "$ASSETS" | grep -qx "app-release.apk" || ! printf '%s\n' "$ASSETS" | grep -qx "app-release.apk.sha256"; then
            echo "::error::Release v${VERSION_NAME} verification failed: expected both app-release.apk and app-release.apk.sha256 assets."
            exit 1
          fi

      - name: Clean up Keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release-keystore.jks"
